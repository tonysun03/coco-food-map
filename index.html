<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf2" />
    <meta name="description" content="记录我们爱吃的每一种味道，一张专属的可爱美食地图。" />
    <title>coco‘s food map · 我们的好吃备忘录</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      (async function () {
        const trackingInterval = 30 * 60 * 1000;
        const trackingKey = 'access_tracking_last_uploaded_at';
        const localHostnames = new Set(['localhost', '127.0.0.1', '0.0.0.0', '::1']);

        // 开发模式或通过本机地址调试时，不执行任何埋点请求。
        if ('%MODE%' !== 'production' || localHostnames.has(location.hostname)) return;

        // 同一站点同一浏览器 30 分钟内只上传一次，刷新页面不会重复上报。
        const now = Date.now();
        let lastUploadedAt = 0;
        try {
          lastUploadedAt = Number(localStorage.getItem(trackingKey));
        } catch (err) {
          // 隐私模式下 localStorage 可能不可用，不影响本次埋点。
          console.warn('读取埋点时间失败', err);
        }
        if (Number.isFinite(lastUploadedAt) && now - lastUploadedAt < trackingInterval) return;

        try {
          // IP 只是补充信息：接口失败、超时或被地区网络拦截时，不能阻断埋点。
          const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
          const info = {
            ip: '未知',
            city: '未知',
            region: '未知',
            country: '未知',
            isp: '未知',
            userAgent: navigator.userAgent,
            screen: `${screen.width}x${screen.height}`,
            viewport: `${window.innerWidth}x${window.innerHeight}`,
            pixelRatio: window.devicePixelRatio || 1,
            language: navigator.language || '未知',
            languages: navigator.languages?.join(', ') || '未知',
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || '未知',
            platform: navigator.platform || '未知',
            touchPoints: navigator.maxTouchPoints || 0,
            cores: navigator.hardwareConcurrency || '未知',
            deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory}GB` : '未知',
            online: navigator.onLine ? '在线' : '离线',
            network: connection
              ? `${connection.effectiveType || '未知'} / ${connection.downlink || '未知'}Mbps`
              : '未知',
            page: location.href,
            path: location.pathname,
            referrer: document.referrer || '直接访问',
            utm: location.search || '无',
            time: new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' })
          };

          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2500);
            try {
              const ipRes = await fetch('https://ipapi.co/json/', { signal: controller.signal });

              if (!ipRes.ok) throw new Error(`IP 接口返回 ${ipRes.status}`);

              const ipData = await ipRes.json();
              info.ip = ipData.ip || info.ip;
              info.city = ipData.city || info.city;
              info.region = ipData.region || info.region;
              info.country = ipData.country_name || info.country;
              info.isp = ipData.org || info.isp;
            } finally {
              clearTimeout(timeoutId);
            }
          } catch (err) {
            console.warn('获取 IP 信息失败，继续上报基础埋点', err);
          }

          // 组装消息内容
          const content = `
IP：${info.ip}
位置：${info.city} / ${info.region} / ${info.country}
运营商：${info.isp}
设备：${info.userAgent}
屏幕：${info.screen}
窗口：${info.viewport}
像素比：${info.pixelRatio}
语言：${info.language}（${info.languages}）
时区：${info.timezone}
平台：${info.platform}
触控点：${info.touchPoints}
CPU 核心：${info.cores}
设备内存：${info.deviceMemory}
网络：${info.network}，${info.online}
页面：${info.page}
路径：${info.path}
来源：${info.referrer}
参数：${info.utm}
时间：${info.time}
    `.trim();

          // 发送到 PushPlus（把下面的 token 换成你自己的）
          const pushRes = await fetch('https://www.pushplus.plus/send', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              token: 'd0143cc3a7fe4b0395bb46e2aeb5f3ac',
              title: '🟢 新访客访问了你的网站',
              content: content,
              template: 'txt'
            })
          });

          if (!pushRes.ok) throw new Error(`PushPlus 返回 ${pushRes.status}`);
          const pushData = await pushRes.json();
          if (pushData.code !== 200) throw new Error(pushData.msg || 'PushPlus 上报失败');

          // 只有 PushPlus 确认成功后才记录时间，避免 IP 失败造成半小时不再重试。
          try {
            localStorage.setItem(trackingKey, String(Date.now()));
          } catch (err) {
            console.warn('保存埋点时间失败', err);
          }
        } catch (err) {
          console.log('推送失败', err);
        }
      })();
    </script>
  </body>
</html>
